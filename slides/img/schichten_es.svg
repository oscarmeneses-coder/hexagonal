<text x="880" y="587.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#b3452b" font-weight="600" text-anchor="start">todas las flechas terminan aquí</text>
<text x="120" y="91.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#6b7c8c" font-weight="600" text-anchor="middle">Al menos:</text>
<text x="120" y="109.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#6b7c8c" font-weight="normal" text-anchor="middle">Los DTOs viajan hacia arriba —</text>
<text x="120" y="125.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#6b7c8c" font-weight="normal" text-anchor="middle">la entidad permanece debajo</text>
<text x="120" y="141.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#6b7c8c" font-weight="normal" text-anchor="middle">la capa de servicio</text>
<rect x="240" y="636" width="720" height="50" rx="8" fill="#f5f8fa" stroke="#1c3d5a" stroke-width="1.6"/>
<text x="600" y="657" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#1c3d5a" font-weight="700" text-anchor="middle">Todas las dependencias apuntan hacia abajo — a la tecnología.</text>
<text x="600" y="675" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#6b7c8c" font-weight="normal" text-anchor="middle">El mapeo de DTO hacia arriba no cambia nada: el núcleo descansa sobre JPA y la base de datos.</text>
