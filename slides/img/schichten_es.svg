<text x="344" y="149.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#1c3d5a" font-weight="normal" text-anchor="end">llama</text>
<text x="590" y="149.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#6b7c8c" font-weight="normal" text-anchor="start">· fluye de vuelta</text>
<line x1="872" y1="289.0" x2="655.0" y2="289.0" stroke="#b3452b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrA)"/>
<text x="880" y="283.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#b3452b" font-weight="600" text-anchor="start">La lógica de negocio vive aquí —</text>
<text x="880" y="301.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#b3452b" font-weight="600" text-anchor="start">y depende de todo lo que está debajo</text>
<line x1="872" y1="481.0" x2="655.0" y2="481.0" stroke="#b3452b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrA)"/>
<text x="880" y="475.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#b3452b" font-weight="600" text-anchor="start">La entidad sirve a dos señores:</text>
<text x="880" y="493.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#b3452b" font-weight="600" text-anchor="start">Esquema de base de datos y modelo de dominio</text>
<line x1="872" y1="575.0" x2="562.0" y2="575.0" stroke="#b3452b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrA)"/>
